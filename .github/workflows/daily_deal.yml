name: Ananas Daily Scraper Test
on:
  schedule:
    #This runs every day until 08. 03. 2026.
    - cron: '1 7-21/2 * * *'
  workflow_dispatch:

jobs:
  scrape_and_mail:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check Expiration Date
        run: |
          # Get current date in YYYYMMDD format
          CURRENT_DATE=$(date +%Y%m%d)
          # Setting limit to 8th of March 2026
          EXPIRY_DATE=20260308
          
          if [ "$CURRENT_DATE" -gt "$EXPIRY_DATE" ]; then
            echo "The promotion has ended. Stopping workflow."
            exit 0  # Exits successfully but doesn't run the next steps
          fi
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4
          
      - name: Run Scraper
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python ananas_scraper_selenium.py
